[project]
name = "pricesenseai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adlfs>=2024.2.0",
    "dotenv>=0.9.9",
    "fsspec>=2024.2.0",
    "requests>=2.33.1",
    "s3fs>=2024.2.0",
]

[tool.uv.workspace]
members = [
    "backend",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
markers = [
    "unit: fast module-level tests that do not exercise FastAPI routing",
    "integration: tests that exercise FastAPI routes, middleware, and handlers",
    "api: HTTP API contract tests",
]
