[project]
name = "pricesense-local"
version = "0.1.0"
description = "Local ML development and experimentation environment for PriceSense AI"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "mlflow>=2.12",
    "jupyter>=1.0",
    "notebook>=7.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "shap>=0.45",
    "torch>=2.2",
    "ipykernel>=6.0",
]

# Standalone project — not a member of the root uv workspace.
# This keeps heavy ML deps isolated from the backend venv.
#
# Usage:
#   cd local
#   uv sync                          # creates local/.venv
#   uv run python data/generate_sample_data.py
#   uv run jupyter notebook notebooks/

[tool.pytest.ini_options]
testpaths = ["../databricks/tests/unit"]
