bundle:
  name: pricesense-ai

variables:
  storage_path:
    description: "Cloud storage root (e.g. abfss://container@account.dfs.core.windows.net/pricesense or s3://bucket/pricesense)"
    default: ""
  catalog:
    description: "Unity Catalog catalog name (leave empty to use legacy Hive metastore)"
    default: ""
  alert_email:
    description: "Email address for failure alerts"
    default: "pranavc1300@gmail.com"

targets:
  dev:
    mode: development
    default: true
    variables:
      storage_path: ${workspace.file_path}/data   # local workspace storage for dev

  prod:
    mode: production
    variables:
      storage_path: ${var.storage_path}

workspace:
  # Set DATABRICKS_HOST and DATABRICKS_TOKEN in your environment,
  # or run: databricks configure
  root_path: /Shared/pricesense-ai/${bundle.target}

resources:
  jobs:

    # ── 1. Daily Ingestion Pipeline ─────────────────────────────────────────────
    # scrape_raw → ingest_bronze → silver_clean → gold_features
    # Runs at 01:00 UTC so scraping finishes before business hours.
    full_pipeline:
      name: "[PriceSenseAi] Full Pipeline"
      description: "Daily: Oxylabs scrape → bronze → silver → gold features"

      schedule:
        quartz_cron_expression: "0 0 1 * * ?"   # 01:00 UTC daily
        timezone_id: UTC

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
            spark_conf:
              "spark.databricks.delta.preview.enabled": "true"
            custom_tags:
              project: pricesense-ai

      environments:
        - environment_key: scraper_env
          spec:
            client: "1"
            dependencies:
              - fsspec>=2024.2.0
              - s3fs>=2024.2.0
              - adlfs>=2024.2.0
              - requests>=2.33.1

      tasks:
        - task_key: scrape_raw
          python_wheel_task:
            package_name: pricesenseai
            entry_point: ingest_products
            parameters:
              - "--manifest"
              - "./ingestion/asins.txt"
              - "--output"
              - ${var.storage_path}
              - "--domain"
              - "com"
              - "--geo"
              - "10001"
          environment_key: scraper_env
          task_settings:
            env_vars:
              OXYLABS_USERNAME: "{{secrets/pricesense/OXYLABS_USERNAME}}"
              OXYLABS_PASSWORD: "{{secrets/pricesense/OXYLABS_PASSWORD}}"
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 300000

        - task_key: ingest_bronze
          depends_on:
            - task_key: scrape_raw
          notebook_task:
            notebook_path: ./notebooks/ingestion/01_bronze_ingestion.py
            base_parameters:
              storage_path: ${var.storage_path}
          job_cluster_key: shared_cluster
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 300000

        - task_key: silver_clean
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/processing/02_silver_cleaning.py
            base_parameters:
              storage_path: ${var.storage_path}
          job_cluster_key: shared_cluster
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 300000

        - task_key: gold_features
          depends_on:
            - task_key: silver_clean
          notebook_task:
            notebook_path: ./notebooks/processing/03_gold_features.py
          job_cluster_key: shared_cluster
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 300000

    # ── 2. Weekly Training Pipeline ─────────────────────────────────────────────
    # feature_store → train_model → evaluate_model
    # Runs Monday 02:00 UTC — after enough weekly history has accumulated.
    training_pipeline:
      name: "[PriceSenseAi] Training Pipeline"
      description: "Weekly: register features → train XGBoost → evaluate & promote to Production"

      schedule:
        quartz_cron_expression: "0 0 2 ? * MON"   # 02:00 UTC every Monday
        timezone_id: UTC

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
            spark_conf:
              "spark.databricks.delta.preview.enabled": "true"
            custom_tags:
              project: pricesense-ai
              layer: ml

      tasks:
        - task_key: feature_store_register
          notebook_task:
            notebook_path: ./notebooks/training/04_feature_store.py
          job_cluster_key: ml_cluster
          timeout_seconds: 1800

        - task_key: train_model
          depends_on:
            - task_key: feature_store_register
          notebook_task:
            notebook_path: ./notebooks/training/05_train_price_model.py
            base_parameters:
              test_size: "0.2"
              n_estimators: "200"
              max_depth: "4"
              learning_rate: "0.05"
              min_history_days: "7"
          job_cluster_key: ml_cluster
          timeout_seconds: 7200
          max_retries: 0

        - task_key: evaluate_model
          depends_on:
            - task_key: train_model
          notebook_task:
            notebook_path: ./notebooks/training/06_evaluate_model.py
            base_parameters:
              max_rmse: "10.0"
              max_mape: "15.0"
              auto_promote: "true"
          job_cluster_key: ml_cluster
          timeout_seconds: 1800

    # ── 3. Daily Scoring Pipeline ────────────────────────────────────────────────
    # batch_score → write gold.price_predictions
    # Runs at 03:00 UTC daily, after the ingestion pipeline completes.
    scoring_pipeline:
      name: "[PriceSenseAi] Scoring Pipeline"
      description: "Daily: load Production model → score gold features → write predictions"

      schedule:
        quartz_cron_expression: "0 0 3 * * ?"   # 03:00 UTC daily
        timezone_id: UTC

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: scoring_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
            custom_tags:
              project: pricesense-ai
              layer: inference

      tasks:
        - task_key: batch_score
          notebook_task:
            notebook_path: ./notebooks/inference/07_batch_scoring.py
            base_parameters:
              scrape_date: ""   # blank = today UTC
          job_cluster_key: scoring_cluster
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 300000

    # ── 4. Daily Monitoring Pipeline ─────────────────────────────────────────────
    # data_drift → model_performance
    # Runs at 04:00 UTC daily, after scoring completes.
    monitoring_pipeline:
      name: "[PriceSenseAi] Monitoring Pipeline"
      description: "Daily: check data drift + model performance, alert on degradation"

      schedule:
        quartz_cron_expression: "0 0 4 * * ?"   # 04:00 UTC daily
        timezone_id: UTC

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: monitor_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
            custom_tags:
              project: pricesense-ai
              layer: monitoring

      tasks:
        - task_key: data_drift
          notebook_task:
            notebook_path: ./notebooks/monitoring/08_data_drift.py
            base_parameters:
              scrape_date: ""
              lookback_days: "30"
              ks_pvalue_thresh: "0.05"
              mean_drift_thresh: "20.0"
          job_cluster_key: monitor_cluster
          timeout_seconds: 1800

        - task_key: model_performance
          depends_on:
            - task_key: data_drift
          notebook_task:
            notebook_path: ./notebooks/monitoring/09_model_performance.py
            base_parameters:
              scrape_date: ""
              lookback_days: "7"
              mape_alert_pct: "15.0"
          job_cluster_key: monitor_cluster
          timeout_seconds: 1800

    # ── Bronze-only job (manual use / debugging) ─────────────────────────────────
    bronze_ingestion:
      name: "[PriceSenseAi] Bronze Ingestion (manual)"
      description: "Ad-hoc — reads existing Oxylabs JSON and appends to bronze tables"
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/ingestion/01_bronze_ingestion.py
            base_parameters:
              storage_path: ${var.storage_path}
              scrape_date: ""   # blank = today UTC
          job_cluster_key: shared_cluster
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 300000
      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
            custom_tags:
              project: pricesense-ai
              layer: bronze
