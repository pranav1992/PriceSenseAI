bundle:
  name: pricesense-ai

variables:
  storage_path:
    description: "Cloud storage root (e.g. abfss://container@account.dfs.core.windows.net/pricesense or s3://bucket/pricesense)"
    default: ""
  catalog:
    description: "Unity Catalog catalog name (leave empty to use legacy Hive metastore)"
    default: ""
  alert_email:
    description: "Email address for failure alerts"
    default: "pranavc1300@gmail.com"

targets:
  dev:
    mode: development
    default: true
    variables:
      storage_path: ${workspace.file_path}/data   # local workspace storage for dev

  prod:
    mode: production
    variables:
      storage_path: ${var.storage_path}

workspace:
  # Set DATABRICKS_HOST and DATABRICKS_TOKEN in your environment,
  # or run: databricks configure
  root_path: /Shared/pricesense-ai/${bundle.target}

resources:
  jobs:
    # ── Full Pipeline ────────────────────────────────────────────────────────
    # scrape_raw → ingest_bronze → silver_clean → gold_features
    # Scheduled at 01:00 UTC daily so scraping completes well before
    # business hours and there is headroom for retries.
    full_pipeline:
      name: "[PriceSenseAi] Full Pipeline"
      description: "End-to-end daily pipeline: Oxylabs scrape → bronze → silver → gold"

      schedule:
        quartz_cron_expression: "0 0 1 * * ?"   # 01:00 UTC daily
        timezone_id: UTC

      email_notifications:
        on_failure:
          - ${var.alert_email}

      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_DS3_v2   # Azure — change to m5.xlarge for AWS
            num_workers: 1
            spark_conf:
              "spark.databricks.delta.preview.enabled": "true"
            custom_tags:
              project: pricesense-ai

      environments:
        - environment_key: scraper_env
          spec:
            client: "1"
            dependencies:
              - fsspec>=2024.2.0
              - s3fs>=2024.2.0
              - adlfs>=2024.2.0
              - requests>=2.33.1

      tasks:
        # 1. Scrape Oxylabs → write JSON to cloud storage
        - task_key: scrape_raw
          python_wheel_task:
            package_name: pricesenseai
            entry_point: ingest_products
            parameters:
              - "--manifest"
              - "./ingestion/asins.txt"
              - "--output"
              - ${var.storage_path}
              - "--domain"
              - "com"
              - "--geo"
              - "10001"
          environment_key: scraper_env
          task_settings:
            env_vars:
              OXYLABS_USERNAME: "{{secrets/pricesense/OXYLABS_USERNAME}}"
              OXYLABS_PASSWORD: "{{secrets/pricesense/OXYLABS_PASSWORD}}"
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 300000

        # 2. Append raw JSON to bronze Delta tables
        - task_key: ingest_bronze
          depends_on:
            - task_key: scrape_raw
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            base_parameters:
              storage_path: ${var.storage_path}
          job_cluster_key: shared_cluster
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 300000

        # 3. Deduplicate and normalise into silver tables
        - task_key: silver_clean
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver_cleaning.py
            base_parameters:
              storage_path: ${var.storage_path}
          job_cluster_key: shared_cluster
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 300000

        # 4. Compute ML features into gold table
        - task_key: gold_features
          depends_on:
            - task_key: silver_clean
          notebook_task:
            notebook_path: ./notebooks/03_gold_features.py
          job_cluster_key: shared_cluster
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 300000

    # ── Bronze-only job (manual use / debugging) ─────────────────────────────
    # No schedule — run ad-hoc when you need to re-ingest a specific date
    # without going through the full pipeline.
    bronze_ingestion:
      name: "[PriceSenseAi] Bronze Ingestion (manual)"
      description: "Ad-hoc job — reads existing Oxylabs JSON and appends to bronze tables"
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            base_parameters:
              storage_path: ${var.storage_path}
              scrape_date: ""   # blank = today UTC
          job_cluster_key: shared_cluster
          timeout_seconds: 1800
          max_retries: 1
          min_retry_interval_millis: 300000
      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_DS3_v2
            num_workers: 1
            custom_tags:
              project: pricesense-ai
              layer: bronze
